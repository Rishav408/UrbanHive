<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices Management - Urban Hive</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="icon" href="../../assets/favicon.ico">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">Urban Hive</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <p class="nav-section-title">Main</p>
                    <a href="dashboard.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="notices.html" class="nav-link active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Notices</span>
                    </a>
                    <a href="complaints.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11l3 3L22 4"></path>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        <span>Complaints</span>
                    </a>
                    <a href="workers.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                        <span>Workers</span>
                    </a>
                    <a href="residents.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Residents</span>
                    </a>
                    <a href="reports.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        <span>Reports</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">M</div>
                    <div class="user-info">
                        <div class="user-name">Manager</div>
                        <div class="user-role">Manager</div>
                    </div>
                    <button class="logout-btn" title="Logout">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="topbar-actions">
                    <button class="topbar-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="content-area">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.25rem;">Notices Management</h1>
                        <p class="text-muted">Create and manage society notices</p>
                    </div>
                    <button class="btn btn-primary" onclick="showModal('newNoticeModal')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Create Notice
                    </button>
                </div>

                <!-- Stats -->
                <div class="stats-grid" style="margin-bottom: 1.5rem;">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-title">Total Notices</span>
                            <div class="stat-card-icon primary">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="totalNotices">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-title">Urgent</span>
                            <div class="stat-card-icon" style="background: rgba(239, 68, 68, 0.2); color: var(--destructive);">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="urgentNotices">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-title">Important</span>
                            <div class="stat-card-icon warning">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="importantNotices">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-title">Normal</span>
                            <div class="stat-card-icon success">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="normalNotices">0</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body" style="padding: 1rem;">
                        <div class="flex items-center gap-4" style="flex-wrap: wrap;">
                            <div class="form-group" style="margin: 0; flex: 1; min-width: 150px;">
                                <select id="priorityFilter" onchange="filterNotices()">
                                    <option value="">All Priorities</option>
                                    <option value="urgent">Urgent</option>
                                    <option value="important">Important</option>
                                    <option value="normal">Normal</option>
                                </select>
                            </div>
                            <div class="form-group" style="margin: 0; flex: 2; min-width: 200px;">
                                <input type="text" id="searchInput" placeholder="Search notices..." onkeyup="filterNotices()">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notices Grid -->
                <div class="grid" id="noticesGrid" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));"></div>
            </div>
        </main>
    </div>

    <!-- New Notice Modal -->
    <div id="newNoticeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create New Notice</h3>
            </div>
            <div class="modal-body">
                <form id="noticeForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" placeholder="Notice title" required>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select name="priority" required>
                            <option value="normal">Normal</option>
                            <option value="important">Important</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Content</label>
                        <textarea name="content" rows="4" placeholder="Notice content..." required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="hideModal('newNoticeModal')">Cancel</button>
                <button class="btn btn-primary" onclick="submitNotice()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    Publish
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Notice Modal -->
    <div id="editNoticeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Notice</h3>
            </div>
            <div class="modal-body">
                <form id="editNoticeForm">
                    <input type="hidden" name="id" id="editNoticeId">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select name="priority" id="editPriority" required>
                            <option value="normal">Normal</option>
                            <option value="important">Important</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Content</label>
                        <textarea name="content" id="editContent" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="hideModal('editNoticeModal')">Cancel</button>
                <button class="btn btn-primary" onclick="updateNotice()">Update</button>
            </div>
        </div>
    </div>

    <script src="../../scripts/core/data.js"></script>
    <script src="../../scripts/core/dashboard.js"></script>
    <script>
        const user = requireAuth();
        if (!user || user.role !== 'manager') {
            window.location.href = 'login.html';
        }

        function updateStats() {
            document.getElementById('totalNotices').textContent = data.notices.length;
            document.getElementById('urgentNotices').textContent = data.notices.filter(n => n.priority === 'urgent').length;
            document.getElementById('importantNotices').textContent = data.notices.filter(n => n.priority === 'important').length;
            document.getElementById('normalNotices').textContent = data.notices.filter(n => n.priority === 'normal').length;
        }

        function renderNotices(notices) {
            const grid = document.getElementById('noticesGrid');
            grid.innerHTML = notices.map(n => `
                <div class="card" style="${n.priority === 'urgent' ? 'border-color: var(--destructive);' : n.priority === 'important' ? 'border-color: var(--warning);' : ''}">
                    <div class="card-body">
                        <div class="flex items-start justify-between mb-3">
                            <h3 style="font-weight: 600; font-size: 1rem;">${n.title}</h3>
                            ${createBadge(n.priority)}
                        </div>
                        <p class="text-muted" style="font-size: 0.875rem; margin-bottom: 1rem; line-height: 1.5;">${n.content}</p>
                        <div class="flex items-center justify-between" style="padding-top: 1rem; border-top: 1px solid var(--border);">
                            <div class="text-xs text-muted">
                                <div>${formatDate(n.createdAt)}</div>
                                <div>By: ${n.createdBy}</div>
                            </div>
                            <div class="flex gap-2">
                                <button class="btn btn-outline" style="padding: 0.375rem 0.75rem; font-size: 0.75rem;" onclick="editNotice('${n.id}')">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                    Edit
                                </button>
                                <button class="btn" style="padding: 0.375rem 0.75rem; font-size: 0.75rem; background: var(--destructive); color: white;" onclick="deleteNotice('${n.id}')">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterNotices() {
            const priority = document.getElementById('priorityFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = data.notices;
            if (priority) filtered = filtered.filter(n => n.priority === priority);
            if (search) filtered = filtered.filter(n => 
                n.title.toLowerCase().includes(search) || 
                n.content.toLowerCase().includes(search)
            );
            renderNotices(filtered);
        }

        function submitNotice() {
            const form = document.getElementById('noticeForm');
            const formData = new FormData(form);
            
            const title = formData.get('title');
            const priority = formData.get('priority');
            const content = formData.get('content');
            
            if (!title || !priority || !content) {
                showToast('Please fill all fields', 'error');
                return;
            }
            
            const newNotice = {
                id: `N${String(data.notices.length + 1).padStart(3, '0')}`,
                title: title,
                content: content,
                createdAt: new Date().toISOString().split('T')[0],
                priority: priority,
                createdBy: user.name
            };
            
            data.notices.unshift(newNotice);
            hideModal('newNoticeModal');
            form.reset();
            filterNotices();
            updateStats();
            showToast('Notice published successfully!', 'success');
        }

        function editNotice(id) {
            const notice = data.notices.find(n => n.id === id);
            document.getElementById('editNoticeId').value = notice.id;
            document.getElementById('editTitle').value = notice.title;
            document.getElementById('editPriority').value = notice.priority;
            document.getElementById('editContent').value = notice.content;
            showModal('editNoticeModal');
        }

        function updateNotice() {
            const id = document.getElementById('editNoticeId').value;
            const notice = data.notices.find(n => n.id === id);
            
            notice.title = document.getElementById('editTitle').value;
            notice.priority = document.getElementById('editPriority').value;
            notice.content = document.getElementById('editContent').value;
            
            hideModal('editNoticeModal');
            filterNotices();
            updateStats();
            showToast('Notice updated successfully!', 'success');
        }

        function deleteNotice(id) {
            if (confirm('Are you sure you want to delete this notice?')) {
                const index = data.notices.findIndex(n => n.id === id);
                data.notices.splice(index, 1);
                filterNotices();
                updateStats();
                showToast('Notice deleted successfully!', 'success');
            }
        }

        // Initialize
        updateStats();
        renderNotices(data.notices);
    </script>
</body>
</html>
