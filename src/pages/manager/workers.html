<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workers Management - Urban Hive</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="icon" href="../../assets/favicon.ico">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">Urban Hive</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <p class="nav-section-title">Main</p>
                    <a href="dashboard.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="notices.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>Notices</span>
                    </a>
                    <a href="complaints.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                        <span>Complaints</span>
                    </a>
                    <a href="workers.html" class="nav-link active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                        <span>Workers</span>
                    </a>
                    <a href="residents.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                        <span>Residents</span>
                    </a>
                    <a href="reports.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                        <span>Reports</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">M</div>
                    <div class="user-info">
                        <div class="user-name">Manager</div>
                        <div class="user-role">Manager</div>
                    </div>
                    <button class="logout-btn" title="Logout">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="topbar-actions">
                    <button class="topbar-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </button>
                </div>
            </div>
            <div class="content-area">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.25rem;">Workers Management</h1>
                        <p class="text-muted">Manage society workers and staff</p>
                    </div>
                    <button class="btn btn-primary" onclick="showModal('addWorkerModal')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add Worker
                    </button>
                </div>
                <div class="stats-grid" style="margin-bottom: 1.5rem;">
                    <div class="stat-card"><div class="stat-card-header"><span class="stat-card-title">Total Workers</span><div class="stat-card-icon primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div></div><div class="stat-card-value" id="totalWorkers">0</div></div>
                    <div class="stat-card"><div class="stat-card-header"><span class="stat-card-title">Active</span><div class="stat-card-icon success"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div></div><div class="stat-card-value" id="activeWorkers">0</div></div>
                    <div class="stat-card"><div class="stat-card-header"><span class="stat-card-title">On Leave</span><div class="stat-card-icon warning"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg></div></div><div class="stat-card-value" id="onLeaveWorkers">0</div></div>
                    <div class="stat-card"><div class="stat-card-header"><span class="stat-card-title">Assigned Tasks</span><div class="stat-card-icon info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div></div><div class="stat-card-value" id="assignedTasks">0</div></div>
                </div>
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-body" style="padding: 1rem;">
                        <div class="flex items-center gap-4" style="flex-wrap: wrap;">
                            <div class="form-group" style="margin: 0; flex: 1; min-width: 150px;"><select id="typeFilter" onchange="filterWorkers()"><option value="">All Types</option><option value="Cleaner">Cleaner</option><option value="Security">Security</option><option value="Plumber">Plumber</option><option value="Electrician">Electrician</option><option value="Maintenance">Maintenance</option></select></div>
                            <div class="form-group" style="margin: 0; flex: 1; min-width: 150px;"><select id="statusFilter" onchange="filterWorkers()"><option value="">All Status</option><option value="Active">Active</option><option value="On Leave">On Leave</option></select></div>
                            <div class="form-group" style="margin: 0; flex: 2; min-width: 200px;"><input type="text" id="searchInput" placeholder="Search workers..." onkeyup="filterWorkers()"></div>
                        </div>
                    </div>
                </div>
                <div class="card"><div class="card-body" style="padding: 0;"><div class="table-container"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Shift</th><th>Phone</th><th>Status</th><th>Joining Date</th><th>Actions</th></tr></thead><tbody id="workersTable"></tbody></table></div></div></div>
            </div>
        </main>
    </div>
    <div id="addWorkerModal" class="modal-overlay" style="display: none;">
        <div class="modal"><div class="modal-header"><h3 class="modal-title">Add New Worker</h3></div><div class="modal-body"><form id="workerForm"><div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="Worker name" required></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"><div class="form-group"><label>Type</label><select name="type" required><option value="">Select type</option><option value="Cleaner">Cleaner</option><option value="Security">Security</option><option value="Plumber">Plumber</option><option value="Electrician">Electrician</option><option value="Maintenance">Maintenance</option></select></div><div class="form-group"><label>Shift</label><select name="shift" required><option value="">Select shift</option><option value="Morning">Morning</option><option value="Evening">Evening</option><option value="Night">Night</option></select></div></div><div class="form-group"><label>Phone Number</label><input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required></div></form></div><div class="modal-footer"><button class="btn btn-outline" onclick="hideModal('addWorkerModal')">Cancel</button><button class="btn btn-primary" onclick="addWorker()">Add Worker</button></div></div>
    </div>
    <div id="viewWorkerModal" class="modal-overlay" style="display: none;">
        <div class="modal"><div class="modal-header"><h3 class="modal-title">Worker Details</h3></div><div class="modal-body" id="viewWorkerBody"></div><div class="modal-footer"><button class="btn btn-outline" onclick="hideModal('viewWorkerModal')">Close</button><button class="btn btn-primary" id="toggleStatusBtn" onclick="toggleWorkerStatus()">Toggle Status</button></div></div>
    </div>
    <div id="assignTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal"><div class="modal-header"><h3 class="modal-title">Assign Task</h3></div><div class="modal-body"><form id="taskForm"><input type="hidden" id="taskWorkerId"><div class="form-group"><label>Task Title</label><input type="text" name="title" placeholder="Task title" required></div><div class="form-group"><label>Description</label><textarea name="description" rows="3" placeholder="Task description..." required></textarea></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"><div class="form-group"><label>Priority</label><select name="priority" required><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div><div class="form-group"><label>Due Date</label><input type="date" name="dueDate" required></div></div></form></div><div class="modal-footer"><button class="btn btn-outline" onclick="hideModal('assignTaskModal')">Cancel</button><button class="btn btn-primary" onclick="assignTask()">Assign Task</button></div></div>
    </div>
    <script src="../../scripts/core/data.js"></script>
    <script src="../../scripts/core/dashboard.js"></script>
    <script>
        const user = requireAuth();
        if (!user || user.role !== 'manager') window.location.href = 'login.html';
        let currentWorkerId = null;
        function updateStats() {
            document.getElementById('totalWorkers').textContent = data.workers.length;
            document.getElementById('activeWorkers').textContent = data.workers.filter(w => w.status === 'Active').length;
            document.getElementById('onLeaveWorkers').textContent = data.workers.filter(w => w.status === 'On Leave').length;
            document.getElementById('assignedTasks').textContent = data.tasks.filter(t => t.status !== 'Completed').length;
        }
        function renderWorkers(workers) {
            document.getElementById('workersTable').innerHTML = workers.map(w => `<tr><td><span style="font-family: monospace; font-size: 0.75rem;">${w.id}</span></td><td><div class="flex items-center gap-2"><div style="width: 2rem; height: 2rem; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600;">${w.name.charAt(0)}</div>${w.name}</div></td><td>${w.type}</td><td>${w.shift}</td><td>${w.phone}</td><td>${createBadge(w.status)}</td><td>${formatDate(w.joiningDate)}</td><td><div class="flex gap-2"><button class="btn btn-outline" style="padding: 0.375rem 0.75rem; font-size: 0.75rem;" onclick="viewWorker('${w.id}')">View</button><button class="btn btn-primary" style="padding: 0.375rem 0.75rem; font-size: 0.75rem;" onclick="openAssignTask('${w.id}')" ${w.status !== 'Active' ? 'disabled' : ''}>Assign Task</button></div></td></tr>`).join('');
        }
        function filterWorkers() {
            let filtered = data.workers;
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (type) filtered = filtered.filter(w => w.type === type);
            if (status) filtered = filtered.filter(w => w.status === status);
            if (search) filtered = filtered.filter(w => w.name.toLowerCase().includes(search) || w.id.toLowerCase().includes(search));
            renderWorkers(filtered);
        }
        function addWorker() {
            const form = document.getElementById('workerForm');
            const formData = new FormData(form);
            if (!formData.get('name') || !formData.get('type') || !formData.get('shift') || !formData.get('phone')) { showToast('Please fill all fields', 'error'); return; }
            data.workers.push({ id: `W${String(data.workers.length + 1).padStart(3, '0')}`, name: formData.get('name'), type: formData.get('type'), shift: formData.get('shift'), phone: formData.get('phone'), status: 'Active', joiningDate: new Date().toISOString().split('T')[0] });
            hideModal('addWorkerModal'); form.reset(); filterWorkers(); updateStats(); showToast('Worker added successfully!', 'success');
        }
        function viewWorker(id) {
            currentWorkerId = id;
            const w = data.workers.find(w => w.id === id);
            const workerTasks = data.tasks.filter(t => t.assignedTo === id);
            document.getElementById('viewWorkerBody').innerHTML = `<div style="display: grid; gap: 1rem;"><div style="display: flex; align-items: center; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);"><div style="width: 4rem; height: 4rem; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600;">${w.name.charAt(0)}</div><div><h3 style="font-weight: 600; font-size: 1.125rem;">${w.name}</h3><p class="text-muted">${w.type} • ${w.shift} Shift</p></div>${createBadge(w.status)}</div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"><div><strong>Worker ID:</strong><br>${w.id}</div><div><strong>Phone:</strong><br>${w.phone}</div><div><strong>Joining Date:</strong><br>${formatDate(w.joiningDate)}</div><div><strong>Active Tasks:</strong><br>${workerTasks.filter(t => t.status !== 'Completed').length}</div></div>${workerTasks.length > 0 ? `<div style="margin-top: 1rem;"><strong>Recent Tasks:</strong><div style="margin-top: 0.5rem; display: grid; gap: 0.5rem;">${workerTasks.slice(0, 3).map(t => `<div style="padding: 0.75rem; background: var(--muted); border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center;"><span>${t.title}</span>${createBadge(t.status)}</div>`).join('')}</div></div>` : ''}</div>`;
            document.getElementById('toggleStatusBtn').textContent = w.status === 'Active' ? 'Mark On Leave' : 'Mark Active';
            showModal('viewWorkerModal');
        }
        function toggleWorkerStatus() {
            const worker = data.workers.find(w => w.id === currentWorkerId);
            worker.status = worker.status === 'Active' ? 'On Leave' : 'Active';
            hideModal('viewWorkerModal'); filterWorkers(); updateStats(); showToast(`Worker marked as ${worker.status}!`, 'success');
        }
        function openAssignTask(id) { currentWorkerId = id; document.getElementById('taskWorkerId').value = id; document.getElementById('taskForm').reset(); showModal('assignTaskModal'); }
        function assignTask() {
            const form = document.getElementById('taskForm');
            const formData = new FormData(form);
            const worker = data.workers.find(w => w.id === currentWorkerId);
            data.tasks.push({ id: `T${String(data.tasks.length + 1).padStart(3, '0')}`, title: formData.get('title'), description: formData.get('description'), assignedBy: user.id, assignedTo: currentWorkerId, workerName: worker.name, dueDate: formData.get('dueDate'), status: 'Pending', priority: formData.get('priority') });
            hideModal('assignTaskModal'); updateStats(); showToast('Task assigned successfully!', 'success');
        }
        updateStats(); renderWorkers(data.workers);
    </script>
</body>
</html>
